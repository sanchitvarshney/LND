# Render Blueprint — deploys LearnGuard as ONE web service (API + built SPA, same origin)
# plus a managed PostgreSQL database. Import this repo in Render → "New +" → "Blueprint".
databases:
  - name: learnguard-db
    plan: free            # change to "basic-256mb" (~$6/mo) to keep data beyond 30 days
    databaseName: learnguard
    user: learnguard

services:
  - type: web
    name: learnguard
    runtime: node
    plan: free            # change to "starter" (~$7/mo) for always-on (no cold starts)
    region: oregon
    buildCommand: |
      cd client && npm install && npm run build && cd ..
      cd server && npm install && npm install -D prisma cross-env && npm install @prisma/client && npx prisma generate && npm run build && cd ..
    startCommand: |
      cd server && npx prisma db push --skip-generate && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: prisma
      - key: CLIENT_DIST
        value: ../client/dist
      - key: DATABASE_URL
        fromDatabase:
          name: learnguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true        # Render generates a strong secret
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false                 # set to your Render URL after first deploy (for CORS)
